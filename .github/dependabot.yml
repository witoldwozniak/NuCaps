version: 2

updates:
  # Workflow actions are pinned to commit hashes, which no one can read by eye.
  # Without this, a pinned hash stays frozen forever and nobody notices when the
  # action it points at gains a security fix. Dependabot updates the hash and the
  # trailing version comment together.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      # All actions in one pull request. An action either works or the build fails
      # loudly, so there is nothing subtle to isolate.
      actions:
        patterns:
          - "*"

  # Quiet today, because the only package reference is the test framework. That
  # changes as soon as NuCaps.Cli takes NuGet.Protocol, which brings nine packages
  # with it.
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    groups:
      # Minor and patch updates travel together. Major updates are deliberately
      # left out of the group, so each one arrives on its own and gets read. A
      # library major can change behavior in ways a passing build does not catch.
      nuget-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  # There is deliberately no dotnet-sdk block. Do not add one.
  #
  # Dependabot reads the version in global.json as a target and proposes a bump. That
  # version is a floor, not a target, because rollForward: latestFeature already
  # accepts any newer software development kit. A bump therefore buys nothing and
  # raises the minimum: the 10.0.400 bump proposed in pull request 1 would have refused
  # the 10.0.1xx feature band that Fedora and other distributions ship.
  #
  # Continuous integration installs the floor version on purpose. A build that passes
  # on the oldest supported kit passes on newer ones.
