name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# This workflow only reads the repository. Grant nothing else.
permissions:
  contents: read

env:
  # .envrc covers local runs only, so CI needs its own opt-out.
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  TESTINGPLATFORM_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1
  # Normalizes the file paths embedded in build output, which makes the build
  # deterministic. This no longer decides anything about warnings. Directory.Build.props
  # treats warnings as errors everywhere, so a warning fails a local run too.
  ContinuousIntegrationBuild: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # Actions are pinned to a commit hash, not a tag. A tag can be repointed at
      # different code by whoever owns the action, and the workflow would run it
      # without any change here. The trailing comment records which release the
      # hash came from, and Dependabot updates both together.
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      # One command, and the same one you run before pushing. This job deliberately
      # keeps no list of its own, because two lists of checks drift apart and the one
      # that drifts is always the list nobody runs by hand.
      #
      # ShellCheck ships preinstalled on GitHub's Ubuntu runner images, so nothing here
      # installs it. The version is whatever the current image carries, and it is
      # usually older than the one on a developer machine. That is the safe direction,
      # because a newer ShellCheck reports more, so a local run catches everything this
      # one catches.
      - name: Run every check
        run: script/check

  # Runs the newcomer path end to end: a fresh clone, then script/bootstrap. The
  # script exists for exactly one situation, somebody who has never seen this project
  # cloning it and running it, so a fresh runner is the correct test rather than a
  # substitute for one.
  #
  # This is a separate job rather than a step in `check`, for two reasons. The
  # checkout stays untouched by anything else, which is the whole point. And bootstrap
  # sets core.hooksPath, which would otherwise apply to every git command in the rest
  # of the job.
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      # Three assertions. The script has to succeed, it has to set the hooks path, and
      # the .envrc block has to run instead of being skipped.
      #
      # Which of the three direnv branches runs is deliberately not asserted. That
      # depends on whether the runner image ships direnv, which GitHub can change
      # without warning, and a change there is not a failure in this project. All
      # three branches mention .envrc, so that is the part worth pinning.
      - name: Run bootstrap on a fresh clone
        run: |
          set -euo pipefail
          script/bootstrap | tee "$RUNNER_TEMP/bootstrap.txt"

          hooks_path="$(git config --get core.hooksPath || true)"
          if [[ "$hooks_path" != ".githooks" ]]; then
            echo "core.hooksPath is '$hooks_path', expected '.githooks'." >&2
            exit 1
          fi

          if ! grep -q '\.envrc' "$RUNNER_TEMP/bootstrap.txt"; then
            echo "bootstrap said nothing about .envrc, so the environment block was skipped." >&2
            exit 1
          fi

      # The script's own header promises that running it again is safe and does
      # nothing new. That promise is worth checking, because it is the difference
      # between a setup script somebody reruns without thinking and one they run once
      # and then avoid.
      - name: Run bootstrap a second time
        run: |
          set -euo pipefail
          script/bootstrap

          hooks_path="$(git config --get core.hooksPath || true)"
          if [[ "$hooks_path" != ".githooks" ]]; then
            echo "core.hooksPath changed on the second run to '$hooks_path'." >&2
            exit 1
          fi
